# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zaidgsmmsup
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://airdithanaprd:44388
            destination: AIRDIT_HANA_VSH
          - url: http://airdithanaprd:44388
            client: '400'
            authenticationType: BasicAuthentication
            destination: AIRDIT_HANA_VSH
            path: /sap/opu/odata/sap/ZP_QU_DG_WORKITM_RQSTS_SRV/
          - url: http://airdithanaprd:44388
            client: '400'
            authenticationType: BasicAuthentication
            destination: AIRDIT_HANA_VSH
            path: /sap/opu/odata/sap/ZC_QU_DG_SM_MASS_SRV/
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_fiori_3
