# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zaidgsmmsup
type: application
framework:
  name: SAPUI5
  version: 1.96.37
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_fiori_3
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_fiori_3
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /sap
            url: http://airdithanaprd:44388
            destination: AIRDIT_HANA_VSH
          - url: http://airdithanaprd:44388
            client: '400'
            authenticationType: BasicAuthentication
            destination: AIRDIT_HANA_VSH
            path: /sap/opu/odata/sap/ZP_QU_DG_WORKITM_RQSTS_SRV/
          - url: http://airdithanaprd:44388
            client: '400'
            authenticationType: BasicAuthentication
            destination: AIRDIT_HANA_VSH
            path: /sap/opu/odata/sap/ZC_QU_DG_SM_MASS_SRV/
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZC_QU_DG_SM_MASS_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZP_QU_DG_SMROOT_SB
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZP_QU_DG_WORKITM_RQSTS_SRV
            metadataPath: ./webapp/localService/ZP_QU_DG_WORKITM_RQSTS_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZP_QU_DG_WORKITM_RQSTS_SRV/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/ZP_QU_DG_WORKITM_RQSTS_SRV/ZP_QU_DG_WORKITM_RQSTS_SRV_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZP_QU_DG_WORKITM_RQSTS_SRV_VAN',Version='0001')/$value/
